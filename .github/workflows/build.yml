name: Android APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 올린 압축 파일 풀기
        run: unzip -q sacheon-dolmen-app.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 파일·글꼴을 안드로이드 프로젝트로 복사

      - name: 웹 파일·글꼴을 안드로이드 프로젝트로 복사
        working-directory: app
        run: |
          npm ci
          npm run sync

      - name: APK 빌드
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 결과물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: sacheon-dolmen-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
